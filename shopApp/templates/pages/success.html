{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Message sent</title>
<link rel="stylesheet" href="{% static 'styles/successStyle.css' %}">
</head>
<body>

<!-- HIDDEN DJANGO MESSAGES -->
<div id="django-messages" style="display:none;">
  {% for m in messages %}<div data-msg="{{ m }}" data-tag="{{ m.tags }}"></div>{% endfor %}
</div>

<header class="top">
  <a class="brand" href="{% url 'home' %}"><i></i>E-Shop</a>
  <a class="back" href="{% url 'home' %}">Shop →</a>
</header>
 
<main class="stage">
  <section class="card" role="status">
    <div class="tick">
      <span class="pulse"></span>
      <svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="44"/><path d="M30 52l14 14 27-30"/></svg>
    </div>
 
    <h1>Message sent!</h1>
    <p class="lead">Thank you for your message! We'll get back to you as soon as we can.</p>
 
    <div class="next">
      <div><b>1</b><span>We receive your message</span></div>
      <div><b>2</b><span>Our team reads it</span></div>
      <div><b>3</b><span>You get a reply by email</span></div>
    </div>
 
    <div class="cta">
      <a class="btn" href="{% url 'home' %}">Continue shopping →</a>
      <a class="btn ghost" href="{% url 'home' %}">Return to Home</a>
    </div>
  </section>
</main>
 
<script>
  // One-time confetti burst
  if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
    const r = document.querySelector('.tick').getBoundingClientRect(), cols = ['#ff77b1', '#ffc93c', '#5fe3b5', '#7b61ff'];
    setTimeout(() => {
      for (let i = 0; i < 60; i++) {
        const p = document.createElement('i'); p.className = 'confetti';
        p.style.background = cols[i % 4]; p.style.left = (r.left + r.width / 2) + 'px'; p.style.top = (r.top + r.height / 2) + 'px';
        document.body.appendChild(p);
        const a = Math.random() * Math.PI * 2, d = 140 + Math.random() * 300;
        p.animate([{ transform: 'translate(0,0) rotate(0)', opacity: 1 },
          { transform: `translate(${Math.cos(a) * d}px,${Math.sin(a) * d + 180}px) rotate(${Math.random() * 720}deg)`, opacity: 0 }],
          { duration: 1400 + Math.random() * 800, easing: 'cubic-bezier(.2,.8,.3,1)' }).onfinish = () => p.remove();
      }
    }, 700);
  }
</script>
<script src="{% static 'js/toast.js' %}"></script>
</body>
</html>
