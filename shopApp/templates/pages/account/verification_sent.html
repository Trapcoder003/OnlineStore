{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verify your email · E-Shop</title>
<link rel="stylesheet" href="{% static 'styles/verification_sent.css' %}">
</head>
<body>
<header class="nav">
  <input type="checkbox" id="nav-toggle" aria-label="Toggle menu">
  <div class="wrap">
    <a class="brand" href="{% url 'home' %}"><i></i>E-Shop</a>
    <label class="burger" for="nav-toggle"><span></span><span></span><span></span></label>
    <nav class="links">
      <a href="{% url 'home' %}">Home</a>
      <a href="{% url 'shop' %}">Shop</a>
    </nav>
  </div>
</header>

<main class="auth-wrap">
  <section class="auth-card narrow center">
    <div class="icon-head">📬</div>
    <h1>Verify your email</h1>
    <p class="sub">
      We've sent a confirmation link to your email. Click it to activate your account.
      If you don't see it, check your spam folder.
    </p>
    <a class="btn ghost" href="{% url 'home' %}">Continue browsing →</a>
  </section>
</main>
</body>
</html>
