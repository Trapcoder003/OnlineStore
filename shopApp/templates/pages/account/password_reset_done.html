{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Check your email · E-Shop</title>
<link rel="stylesheet" href="{% static 'styles/styleHome.css' %}">
<style>
  .auth-wrap {
    max-width: 500px;
    margin: 60px auto;
    padding: 48px 32px;
    background: var(--glass);
    border: 1px solid var(--line);
    border-radius: 24px;
    text-align: center;
    animation: authRise 0.5s ease both;
  }
  @keyframes authRise {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .auth-icon {
    display: grid;
    place-items: center;
    width: 72px;
    height: 72px;
    margin: 0 auto 20px;
    font-size: 36px;
    border-radius: 22px;
    background: linear-gradient(135deg, var(--mint), var(--violet));
    box-shadow: 0 12px 30px rgba(95, 227, 181, 0.35);
    animation: mailPulse 2s ease-in-out infinite;
  }
  @keyframes mailPulse {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.05); }
  }
  .auth-wrap h1 {
    font-size: 24px;
    margin: 0 0 12px;
    font-weight: 800;
  }
  .auth-wrap p {
    color: var(--soft);
    font-size: 15px;
    line-height: 1.7;
    margin: 0 0 16px;
  }
  .auth-wrap p strong {
    color: #fff;
  }
  .auth-note {
    padding: 16px 20px;
    background: rgba(123, 97, 255, 0.08);
    border: 1px solid rgba(123, 97, 255, 0.3);
    border-radius: 12px;
    font-size: 13px;
    color: var(--soft);
    margin: 24px 0;
    line-height: 1.6;
  }
  .auth-btn {
    display: inline-block;
    padding: 15px 32px;
    border-radius: 99px;
    background: linear-gradient(120deg, var(--violet), var(--pink));
    color: #fff;
    font-weight: 700;
    font-size: 15px;
    text-decoration: none;
    box-shadow: 0 10px 26px rgba(123, 97, 255, 0.4);
    transition: transform 0.2s, box-shadow 0.2s;
    margin-top: 8px;
  }
  .auth-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 14px 34px rgba(255, 119, 177, 0.5);
  }
</style>
</head>
<body>

<header class="nav">
  <div class="wrap">
    <a class="brand" href="{% url 'home' %}"><i></i>E-Shop</a>
  </div>
</header>

<main class="wrap page">
  <div class="auth-wrap">
    <div class="auth-icon">📧</div>
    <h1>Check your email</h1>
    <p>
      We've sent a password reset link to your inbox.
      Click the link in the email to set a new password.
    </p>

    <div class="auth-note">
      💡 <strong>Not seeing it?</strong> Check your spam folder.
      The link expires in 3 days.
    </div>

    <a class="auth-btn" href="{% url 'account_login' %}">Back to login →</a>
  </div>
</main>

</body>
</html>
