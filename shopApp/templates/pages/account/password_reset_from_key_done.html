{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Password changed · E-Shop</title>
<link rel="stylesheet" href="{% static 'styles/password_reset_done.css' %}">
</head>
<body>

<header class="nav">
  <input type="checkbox" id="nav-toggle" aria-label="Toggle menu">
  <div class="wrap">
    <a class="brand" href="{% url 'home' %}"><i></i>E-Shop</a>
    <label class="burger" for="nav-toggle"><span></span><span></span><span></span></label>
    <nav class="links">
      <a href="{% url 'home' %}">Home</a>
      <a href="{% url 'shop' %}">Shop</a>
    </nav>
    <div class="icons">
      <a class="icon active" href="{% url 'account_login' %}" aria-label="Account">👤</a>
    </div>
  </div>
</header>

<main class="auth-wrap">
  <section class="auth-card narrow center">
    <div class="tick" aria-hidden="true">
      <span class="pulse"></span>
      <svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="44"/><path d="M30 52l14 14 27-30"/></svg>
    </div>

    <h1>Password updated</h1>
    <p class="sub">You can now sign in with your new password.</p>

    <a class="btn" href="{% url 'account_login' %}">Sign in →</a>
  </section>
</main>

<script>
  /* Confetti burst */
  if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
    const r = document.querySelector('.tick').getBoundingClientRect();
    const colors = ['#ff77b1', '#ffc93c', '#5fe3b5', '#7b61ff'];
    setTimeout(() => {
      for (let i = 0; i < 50; i++) {
        const p = document.createElement('i');
        p.style.cssText = `position:fixed;width:8px;height:8px;border-radius:2px;background:${colors[i % 4]};left:${r.left + r.width / 2}px;top:${r.top + r.height / 2}px;z-index:9999;pointer-events:none`;
        document.body.appendChild(p);
        const a = Math.random() * Math.PI * 2;
        const d = 120 + Math.random() * 260;
        p.animate(
          [{ transform: 'translate(0,0) rotate(0)', opacity: 1 },
           { transform: `translate(${Math.cos(a) * d}px,${Math.sin(a) * d + 160}px) rotate(${Math.random() * 720}deg)`, opacity: 0 }],
          { duration: 1200 + Math.random() * 800, easing: 'cubic-bezier(.2,.8,.3,1)' }
        ).onfinish = () => p.remove();
      }
    }, 400);
  }
</script>

</body>
</html>
