{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Password changed · E-Shop</title>
<link rel="stylesheet" href="{% static 'styles/styleHome.css' %}">
<style>
  .auth-wrap {
    max-width: 480px;
    margin: 60px auto;
    padding: 48px 32px;
    background: var(--glass);
    border: 1px solid var(--line);
    border-radius: 24px;
    text-align: center;
    animation: authRise 0.5s ease both;
  }
  @keyframes authRise {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .auth-icon {
    display: grid;
    place-items: center;
    width: 80px;
    height: 80px;
    margin: 0 auto 24px;
    font-size: 42px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--mint), #00d68f);
    box-shadow: 0 16px 40px rgba(95, 227, 181, 0.5);
    animation: successPop 0.7s cubic-bezier(0.3, 1.6, 0.5, 1) both;
  }
  @keyframes successPop {
    0%   { transform: scale(0.3); opacity: 0; }
    50%  { transform: scale(1.15); }
    100% { transform: scale(1); opacity: 1; }
  }
  .auth-wrap h1 {
    font-size: 26px;
    margin: 0 0 12px;
    font-weight: 800;
    color: var(--mint);
  }
  .auth-wrap p {
    color: var(--soft);
    font-size: 15px;
    line-height: 1.7;
    margin: 0 0 8px;
  }
  .auth-wrap p strong {
    color: #fff;
  }
  .countdown {
    display: inline-block;
    padding: 4px 12px;
    background: rgba(123, 97, 255, 0.15);
    border-radius: 99px;
    font-size: 13px;
    font-weight: 600;
    color: var(--violet);
    margin: 16px 0 24px;
  }
  .countdown span {
    font-weight: 800;
    color: #fff;
    font-family: ui-monospace, monospace;
  }
  .auth-btn {
    display: inline-block;
    padding: 16px 36px;
    border-radius: 99px;
    background: linear-gradient(120deg, var(--violet), var(--pink));
    color: #fff;
    font-weight: 700;
    font-size: 15px;
    text-decoration: none;
    box-shadow: 0 10px 26px rgba(123, 97, 255, 0.4);
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .auth-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 14px 34px rgba(255, 119, 177, 0.5);
  }
</style>
</head>
<body>

<header class="nav">
  <div class="wrap">
    <a class="brand" href="{% url 'home' %}"><i></i>E-Shop</a>
  </div>
</header>

<main class="wrap page">
  <div class="auth-wrap">
    <div class="auth-icon">✅</div>
    <h1>Password changed!</h1>
    <p>Your new password has been saved successfully.</p>
    <p>You can now log in with your new password.</p>

    <div class="countdown">
      Redirecting to login in <span id="countdown">4</span>s…
    </div>

    <div>
      <a class="auth-btn" href="{% url 'account_login' %}">
        Log in now →
      </a>
    </div>
  </div>
</main>

<script>
(function () {
  'use strict';
  let seconds = 4;
  const counter = document.getElementById('countdown');

  const timer = setInterval(function () {
    seconds -= 1;
    if (counter) counter.textContent = seconds;
    if (seconds <= 0) {
      clearInterval(timer);
      window.location.href = "{% url 'account_login' %}";
    }
  }, 1000);
})();
</script>

</body>
</html>
